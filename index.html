<!doctype html>
<html lang="en" data-mask="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Bench</title>
<meta name="description" content="Offline pinouts, quick reference and test points for 8-bit computer repair.">
<meta name="theme-color" content="#1c3829">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Retro Bench">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="dist/app.css">
<!-- Solder mask before first paint: the user's pick, else follow the system (light bench = bare FR-4). -->
<script>try{var m=JSON.parse(localStorage.getItem('rb-mask'));if(['green','black','light'].indexOf(m)<0)m=matchMedia('(prefers-color-scheme: light)').matches?'light':'green';document.documentElement.dataset.mask=m;}catch(e){}</script>
</head>
<body>
<div class="board">
  <span class="hole tl"></span><span class="hole tr"></span><span class="hole bl"></span><span class="hole br"></span>
  <header class="strip" id="strip"></header>
  <nav class="trace" id="trace" aria-label="Breadcrumb"></nav>
  <main id="main" class="px-2.5 pt-1.5 max-sm:px-0"></main>
</div>

<!-- Phone: copper trace from the selected pad to the pin panel, the panel, and the edge-connector bar -->
<svg class="wire wire-fixed" id="wire-phone" aria-hidden="true"></svg>
<aside class="panel" id="panel" aria-label="Pin detail"></aside>
<nav class="edgebar" id="edgebar" aria-label="Main"></nav>

<!-- Glossary popover -->
<div class="pop" id="pop" hidden role="dialog" aria-label="Definition"></div>

<!-- Finder (Ctrl+K or /) -->
<div class="palette" id="palette" hidden>
  <div class="sheet" role="dialog" aria-label="Find">
    <form class="edge" data-act="pal-form" role="search" autocomplete="off"><input id="pal-input" type="search" placeholder="Chip, pin (/RAS, pin 40), BASIC, key, term" aria-label="Find" spellcheck="false"><span class="hint">ESC</span></form>
    <div class="results" id="pal-results"></div>
    <div class="foot"><span>&uarr; &darr; move, Enter opens</span><span>Esc closes</span></div>
  </div>
</div>

<script src="src/data/core.js"></script>
<script src="src/data/commodore.js"></script>
<script src="src/data/apple.js"></script>
<script src="src/data/atari.js"></script>
<script src="src/data/coleco.js"></script>
<script src="src/data/sinclair.js"></script>
<script src="src/data/timex.js"></script>
<script src="src/data/ti.js"></script>
<script src="src/data/tandy.js"></script>
<script src="src/data/heathkit.js"></script>
<script src="src/data/ibm.js"></script>
    <script src="src/data/schematics.js"></script>
<script src="src/connectors.js"></script>
<script src="src/app.js"></script>
</body>
</html>
