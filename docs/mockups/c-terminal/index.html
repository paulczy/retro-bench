<!doctype html>
<html lang="en" data-theme="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d10">
<title>Retro Bench — terminal</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#0b0d10; --panel:#12161c; --panel2:#181d25; --line:#252b34; --line2:#333b47;
  --fg:#d8dce1; --fg2:#8b95a1; --fg3:#5b6573;
  --acc:#f0a830; --acc-dim:rgba(240,168,48,.14); --acc-line:rgba(240,168,48,.45); --on-acc:#0b0d10;
  --red:#ff5a5a; --orange:#ff9e64;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --prose:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cmd-h:52px; --drawer-w:40%;
  --t:160ms ease;
}
[data-theme="green"]{ --acc:#5fd97a; --acc-dim:rgba(95,217,122,.14); --acc-line:rgba(95,217,122,.45); }
@media (prefers-reduced-motion: reduce){ :root{ --t:0s; } }

*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--fg); }
body{ font:14px/1.45 var(--mono); -webkit-font-smoothing:antialiased; padding-top:var(--cmd-h); min-height:100vh; }
a{ color:var(--acc); text-decoration:none; }
a:hover{ text-decoration:underline; text-underline-offset:3px; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; }
.prose{ font-family:var(--prose); font-size:15px; line-height:1.55; max-width:68ch; }
.muted{ color:var(--fg2); } .dim{ color:var(--fg3); }
h1,h2,h3{ font-weight:600; margin:0; }
h1{ font-size:22px; letter-spacing:-.01em; }
h2{ font-size:15px; color:var(--fg2); font-weight:500; }
h3{ font-size:14px; }
code,kbd{ font-family:var(--mono); }
hr{ border:0; border-top:1px solid var(--line); margin:20px 0; }
table{ border-collapse:collapse; width:100%; }
th{ text-align:left; font-weight:500; color:var(--fg2); font-size:12px; padding:8px 10px; border-bottom:1px solid var(--line2); }
td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }

/* bracketed label: [ text ] */
.bk{ color:var(--fg2); white-space:nowrap; min-height:32px; display:inline-flex; align-items:center; gap:4px; padding:0 2px; }
.bk::before{ content:"["; color:var(--fg3); } .bk::after{ content:"]"; color:var(--fg3); }
.bk:hover, .bk.on{ color:var(--acc); } .bk.on::before,.bk.on::after{ color:var(--acc-line); }
.key{ color:var(--acc); } .key::before{ content:"["; color:var(--fg3); } .key::after{ content:"]"; color:var(--fg3); }

.badge{ display:inline-block; font-size:11px; line-height:18px; padding:0 6px; border:1px solid var(--line2); border-radius:3px; color:var(--fg2); vertical-align:middle; white-space:nowrap; }
.badge.vf{ color:var(--acc); border-color:var(--acc-line); }
.badge.hot{ color:var(--red); border-color:rgba(255,90,90,.5); }
.badge.warm{ color:var(--orange); border-color:rgba(255,158,100,.5); }
.badge.cool{ color:var(--fg2); }
.badge.ready{ color:var(--acc); border-color:var(--acc-line); }
.badge.planned{ color:var(--fg3); border-style:dashed; }
.badge.low{ color:var(--fg); border-color:var(--line2); background:var(--panel2); }

/* ---------- command line ---------- */
.cmd{ position:fixed; top:0; left:0; right:0; height:var(--cmd-h); z-index:40; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 16px; }
.cmd .prompt{ color:var(--acc); font-size:18px; user-select:none; }
.cmd input{ flex:1; min-width:0; height:40px; background:transparent; border:0; color:var(--fg); font:16px var(--mono); outline:none; caret-color:var(--acc); }
.cmd input::placeholder{ color:var(--fg3); }
.cmd .brand{ color:var(--fg2); font-size:13px; }
.cmd .brand b{ color:var(--fg); font-weight:600; }
.cmd .right{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--fg2); }
.pwa{ display:inline-flex; align-items:center; gap:6px; color:var(--fg2); }
.pwa i{ width:7px; height:7px; background:var(--acc); display:inline-block; border-radius:1px; }
@media (max-width:640px){ .cmd .pwa span, .cmd .brand{ display:none; } .cmd{ padding:0 12px; } }

.results{ position:fixed; top:var(--cmd-h); left:16px; right:16px; max-width:820px; max-height:calc(100vh - var(--cmd-h) - 24px); overflow:auto; z-index:39; background:var(--panel); border:1px solid var(--line2); border-top:0; }
.results[hidden]{ display:none; }
.rg{ display:grid; grid-template-columns:96px 1fr; border-top:1px solid var(--line); }
.rg:first-child{ border-top:0; }
.rg .gl{ color:var(--fg3); padding:10px 0 10px 12px; font-size:12px; }
.ri{ display:block; padding:9px 12px; color:var(--fg); border-left:1px solid var(--line); min-height:44px; }
.ri:hover{ text-decoration:none; background:var(--panel2); }
.ri.on{ background:var(--acc-dim); }
.ri b{ font-weight:500; } .ri b mark{ background:none; color:var(--acc); }
.ri small{ display:block; color:var(--fg2); font-size:12px; font-family:var(--prose); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rfoot{ padding:8px 12px; color:var(--fg3); font-size:12px; border-top:1px solid var(--line); display:flex; justify-content:space-between; }
.rempty{ padding:14px 12px; color:var(--fg2); }

/* ---------- layout ---------- */
.wrap{ transition:margin-right var(--t); }
body.drawer-open .wrap{ margin-right:var(--drawer-w); }
.crumbs{ padding:12px 24px 0; color:var(--fg3); font-size:13px; display:flex; flex-wrap:wrap; gap:0 2px; }
.crumbs a{ color:var(--fg2); } .crumbs a:hover{ color:var(--acc); } .crumbs span{ color:var(--fg); }
main{ padding:16px 24px 56px; max-width:1180px; }
@media (max-width:640px){ .crumbs{ padding:10px 14px 0; } main{ padding:12px 14px 48px; } }
.head{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px; margin-bottom:6px; }
.head .sub{ color:var(--fg2); }
.sect{ margin-top:28px; }
.sect > h2{ margin-bottom:10px; display:flex; align-items:center; gap:10px; }
.sect > h2::after{ content:""; flex:1; border-top:1px solid var(--line); }
.row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }

/* ---------- home ---------- */
.boot{ margin-top:8px; }
.boot .hint{ color:var(--fg2); margin:4px 0 20px; }
.boot .hint code{ color:var(--acc); }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
.tile{ display:block; border:1px solid var(--line); padding:14px 16px 12px; color:var(--fg); min-height:112px; background:var(--panel); transition:border-color var(--t); }
.tile:hover,.tile:focus-visible{ border-color:var(--acc-line); text-decoration:none; }
.tile .t{ display:flex; align-items:baseline; gap:10px; font-size:16px; font-weight:600; }
.tile .b{ color:var(--fg2); font-family:var(--prose); font-size:13px; margin:6px 0 10px; line-height:1.4; }
.tile .m{ color:var(--fg3); font-size:12px; }
.tile .m b{ color:var(--acc); font-weight:500; }
.recent{ display:flex; flex-wrap:wrap; gap:8px; }
.recent a{ border:1px solid var(--line); padding:8px 12px; color:var(--fg); min-height:44px; display:inline-flex; align-items:center; gap:8px; }
.recent a:hover{ border-color:var(--acc-line); text-decoration:none; }
.recent a small{ color:var(--fg3); }
.links{ display:flex; flex-wrap:wrap; gap:4px 18px; margin-top:8px; }

/* ---------- menu list ---------- */
.menu{ border-top:1px solid var(--line); }
.menu a, .menu .item{ display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:10px; min-height:52px; padding:6px 10px 6px 0; border-bottom:1px solid var(--line); color:var(--fg); }
.menu a:hover{ text-decoration:none; background:var(--panel); }
.menu .nm{ font-weight:500; }
.menu .nm small{ display:block; font-weight:400; color:var(--fg2); font-family:var(--prose); font-size:13px; }
.menu .rt{ color:var(--fg3); font-size:12px; text-align:right; }
.menu .rt .badge{ margin-left:6px; }

/* ---------- machine status block ---------- */
.status{ display:grid; grid-template-columns:max-content 1fr max-content 1fr; gap:4px 14px; border:1px solid var(--line); padding:12px 14px; background:var(--panel); margin:14px 0 20px; }
.status dt{ color:var(--fg3); } .status dd{ margin:0; color:var(--fg); overflow-wrap:anywhere; }
@media (max-width:760px){ .status{ grid-template-columns:max-content 1fr; } }
.first{ margin:0; padding:0; list-style:none; }
.first li{ font-family:var(--prose); font-size:15px; line-height:1.5; padding:4px 0 4px 18px; position:relative; max-width:72ch; }
.first li::before{ content:">"; position:absolute; left:0; color:var(--acc); font-family:var(--mono); }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:0 32px; }
@media (max-width:900px){ .two{ grid-template-columns:1fr; } }

/* fault table */
.faults td:first-child{ font-weight:500; white-space:nowrap; }
.faults .note{ font-family:var(--prose); color:var(--fg2); font-size:13px; }
.chipbtn{ color:var(--acc); border:1px solid var(--acc-line); padding:2px 8px; margin:2px 4px 2px 0; border-radius:3px; min-height:30px; }
.chipbtn:hover{ background:var(--acc-dim); }
@media (max-width:640px){ .faults td:first-child{ white-space:normal; } .faults th:nth-child(3), .faults td:nth-child(3){ display:none; } }

/* ---------- chip list ---------- */
.chips a{ grid-template-columns:72px 1fr auto; }
.chips .loc{ color:var(--fg3); }
.chips .fails{ color:var(--fg2); font-family:var(--prose); font-size:13px; }

/* ---------- chip page ---------- */
.ctl{ display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; margin:16px 0 10px; color:var(--fg3); font-size:13px; }
.ctl .grp{ display:inline-flex; align-items:center; gap:2px; }
.legend{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--fg2); margin-left:auto; }
.legend i, .ty i{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.pinwrap{ display:grid; grid-template-columns:300px 1fr; gap:0 24px; align-items:start; }
.glyph{ position:sticky; top:calc(var(--cmd-h) + 10px); }
.glyph svg{ width:100%; height:auto; display:block; }
.glyph .cap{ text-align:center; color:var(--fg3); font-size:12px; margin-top:6px; }
.glyph text{ font-family:var(--mono); fill:var(--fg2); font-size:11px; }
.glyph text.n{ fill:var(--fg3); font-size:10px; }
.glyph .hit{ fill:transparent; cursor:pointer; }
.glyph .hit.hl{ fill:var(--acc-dim); }
.glyph .hit.sel{ fill:var(--acc-dim); stroke:var(--acc); stroke-width:1.5; }
.glyph .body{ fill:var(--panel2); stroke:var(--line2); }
.glyph .notch{ fill:var(--bg); stroke:var(--line2); }
.glyph line.pin{ stroke-width:6; stroke-linecap:butt; pointer-events:none; }
.glyph .one{ fill:var(--fg); }
.strip{ display:none; }
.pins{ font-size:13px; }
.pins thead th{ position:sticky; top:var(--cmd-h); background:var(--bg); z-index:2; }
.pins th.sortable{ cursor:pointer; } .pins th.sortable:hover{ color:var(--acc); }
.pins th.sorted{ color:var(--acc); }
.pins tr{ cursor:pointer; }
.pins tr.hl td{ background:var(--acc-dim); }
.pins tr.sel td{ background:var(--acc-dim); box-shadow:inset 2px 0 0 var(--acc); }
.pins td{ padding:0 10px; height:44px; white-space:nowrap; }
.pins td.n{ color:var(--fg3); width:40px; text-align:right; }
.pins td.nm{ font-weight:600; width:90px; }
.pins td.dir{ color:var(--fg2); width:48px; }
.pins td.ty{ width:96px; color:var(--fg2); }
.pins td.fn{ color:var(--fg2); font-family:var(--prose); font-size:13px; max-width:0; width:100%; overflow:hidden; text-overflow:ellipsis; }
.pins td.fn .badge{ margin-left:6px; }
@media (max-width:1023px){ .pinwrap{ grid-template-columns:240px 1fr; gap:0 16px; } .pins td.ty{ display:none; } .pins th:nth-child(4){ display:none; } }
@media (max-width:1400px){ body.drawer-open .pinwrap{ grid-template-columns:240px 1fr; gap:0 16px; } body.drawer-open .pins td.ty, body.drawer-open .pins th:nth-child(4){ display:none; } }
@media (max-width:640px){
  .pinwrap{ display:block; }
  .glyph{ display:none; }
  .strip{ display:flex; overflow-x:auto; gap:4px; padding:6px 0 10px; margin-bottom:6px; border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity; }
  .strip button{ flex:0 0 52px; height:56px; border:1px solid var(--line); border-top-width:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:11px; color:var(--fg); scroll-snap-align:start; background:var(--panel); }
  .strip button small{ color:var(--fg3); font-size:10px; }
  .strip button.hl, .strip button.sel{ background:var(--acc-dim); border-left-color:var(--acc); border-right-color:var(--acc); border-bottom-color:var(--acc); }
  .pins td.fn{ white-space:normal; max-width:none; }
  .pins td{ height:auto; padding:8px 8px; }
  .pins td.dir, .pins th:nth-child(3){ display:none; }
  .legend{ margin-left:0; }
}

/* ---------- quick ref panels ---------- */
.panel{ border:1px solid var(--line); margin-bottom:12px; background:var(--panel); }
.panel-h{ width:100%; display:flex; align-items:center; gap:12px; min-height:48px; padding:0 14px; text-align:left; }
.panel-h .tg{ color:var(--acc); width:14px; }
.panel-h .count{ margin-left:auto; color:var(--fg3); font-size:12px; }
.panel-h h2{ color:var(--fg); font-weight:600; }
.panel-b{ padding:4px 14px 16px; border-top:1px solid var(--line); }
.panel.closed .panel-b{ display:none; }
.keys td:first-child{ font-weight:600; white-space:nowrap; width:1%; }
.keys td:last-child{ font-family:var(--prose); color:var(--fg2); }
.ess{ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; margin:8px 0 6px; }
.ess div{ display:grid; grid-template-columns:minmax(120px,42%) 1fr; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
.ess b{ font-weight:600; color:var(--fg); overflow-wrap:anywhere; }
.ess span{ color:var(--fg2); font-family:var(--prose); font-size:13px; }
@media (max-width:900px){ .ess{ grid-template-columns:1fr; } }
.grp{ border-top:1px solid var(--line); }
.grp-h{ width:100%; display:flex; align-items:center; gap:10px; min-height:44px; text-align:left; }
.grp-h .tg{ color:var(--acc); width:14px; } .grp-h .count{ margin-left:auto; color:var(--fg3); font-size:12px; }
.grp-b{ display:none; padding:2px 0 12px 24px; display:none; }
.grp.open .grp-b{ display:flex; flex-wrap:wrap; gap:6px; }
.grp-b code{ border:1px solid var(--line2); padding:4px 8px; font-size:13px; background:var(--bg); }
.quirks li{ font-family:var(--prose); color:var(--fg2); padding:3px 0; }
.mem td:first-child{ color:var(--acc); white-space:nowrap; width:1%; }

/* ---------- ports / power ---------- */
.conn{ border:1px solid var(--line); margin-bottom:14px; background:var(--panel); }
.conn.hi{ border-color:var(--acc-line); }
.conn .ch{ padding:12px 14px 0; }
.conn .ch p{ margin:6px 0 10px; }
.conn table{ font-size:13px; } .conn td:first-child{ color:var(--fg3); width:1%; white-space:nowrap; text-align:right; }
.conn td:nth-child(2){ font-weight:600; white-space:nowrap; } .conn td:last-child{ font-family:var(--prose); color:var(--fg2); }
.rails td:first-child{ font-weight:600; white-space:nowrap; } .rails td{ font-size:13px; }
.rails .ex{ color:var(--acc); white-space:nowrap; } .rails .note{ font-family:var(--prose); color:var(--fg2); }
@media (max-width:640px){ .rails th:nth-child(4), .rails td:nth-child(4){ display:none; } .rails td:first-child{ white-space:normal; } }

/* ---------- glossary / resources / search ---------- */
.terms{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px; }
.terms button{ text-align:left; border:1px solid var(--line); padding:10px 12px; min-height:56px; background:var(--panel); color:var(--fg); }
.terms button:hover{ border-color:var(--acc-line); }
.terms button b{ display:block; font-weight:600; } .terms button span{ color:var(--fg2); font-family:var(--prose); font-size:13px; }
.res td:first-child{ white-space:nowrap; } .res td:last-child{ font-family:var(--prose); color:var(--fg2); }
.sr .rg{ border:1px solid var(--line); margin-bottom:10px; }
.term{ color:var(--fg); border-bottom:1px dotted var(--acc); padding:0 1px; min-height:28px; line-height:1.4; }
.term:hover{ color:var(--acc); }
.termrow{ display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:8px; }
.empty{ border:1px dashed var(--line2); padding:18px 16px; color:var(--fg2); font-family:var(--prose); max-width:60ch; }
.empty code{ color:var(--acc); }

/* ---------- drawer ---------- */
.drawer{ position:fixed; top:var(--cmd-h); right:0; bottom:0; width:var(--drawer-w); background:var(--panel); border-left:1px solid var(--line2); z-index:30; transform:translateX(100%); transition:transform var(--t); display:flex; flex-direction:column; visibility:hidden; }
.drawer.open{ transform:none; visibility:visible; }
.dr-h{ display:flex; align-items:center; gap:10px; min-height:48px; padding:0 14px; border-bottom:1px solid var(--line); color:var(--fg3); font-size:13px; }
.dr-h .ttl{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dr-h .x{ display:inline-flex; }
.dr-b{ overflow:auto; padding:18px 20px 40px; }
.dr-b h1{ font-size:24px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.dr-b h1 .pn{ color:var(--fg3); font-size:14px; font-weight:400; }
.dr-b .meta{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin:10px 0 14px; color:var(--fg2); font-size:13px; }
.dr-b .desc{ margin:0 0 14px; }
.dr-b .probe{ border-left:2px solid var(--acc); padding:8px 12px; margin:14px 0; background:var(--bg); font-family:var(--prose); font-size:14px; }
.dr-b .probe b{ font-family:var(--mono); color:var(--acc); font-weight:500; font-size:12px; display:block; margin-bottom:2px; }
.dr-b h3{ color:var(--fg2); font-weight:500; margin:18px 0 6px; font-size:12px; }
.dr-b ul{ margin:0; padding-left:0; list-style:none; }
.dr-b li{ padding:5px 0; } .dr-b li a{ overflow-wrap:anywhere; }
.pn-nav{ display:flex; justify-content:space-between; margin-top:24px; padding-top:12px; border-top:1px solid var(--line); }
.pn-nav button{ min-width:44px; }
@media (max-width:480px), (max-width:1023px) and (orientation:portrait){
  :root{ --drawer-w:100%; }
  body.drawer-open .wrap{ margin-right:0; }
  .drawer{ border-left:0; }
  .dr-h .x{ display:none; }
}

/* ---------- popover ---------- */
.pop{ position:absolute; z-index:50; width:min(340px, calc(100vw - 24px)); background:var(--panel2); border:1px solid var(--line2); padding:12px 14px; }
.pop[hidden]{ display:none; }
.pop b{ display:block; margin-bottom:4px; }
.pop p{ margin:0 0 10px; font-family:var(--prose); font-size:14px; color:var(--fg2); }
.scrim{ position:fixed; inset:0; z-index:29; display:none; }
body.drawer-open.narrow .scrim{ display:block; }
</style>
</head>
<body>

<header class="cmd">
  <span class="prompt" aria-hidden="true">&gt;</span>
  <input id="cmd" type="search" autocomplete="off" spellcheck="false" placeholder="search · try: ted pin 10" aria-label="Search and command line" enterkeyhint="go">
  <div class="right">
    <button class="bk" id="theme" title="Toggle phosphor colour">amber</button>
    <span class="pwa" title="Mock PWA status"><i></i><span>installed · works offline</span></span>
  </div>
</header>
<div id="results" class="results" hidden role="listbox"></div>

<div class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
  <main id="main"></main>
</div>

<aside id="drawer" class="drawer" aria-label="Detail">
  <div class="dr-h">
    <button class="bk" id="dr-back">&larr; back</button>
    <span class="ttl" id="dr-title"></span>
    <button class="bk x" id="dr-close">esc</button>
  </div>
  <div class="dr-b" id="dr-body"></div>
</aside>
<div class="scrim" id="scrim"></div>
<div id="pop" class="pop" hidden role="dialog"><b></b><p></p><button class="bk" id="pop-more">full definition</button></div>

<script src="../shared/data.js"></script>
<script>
(() => {
'use strict';
const D = window.RCS;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('rbc:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

/* ---------- search index ---------- */
const idx = [];

  quickref: ['quickref', '', 'Quick reference'], quick: ['quickref', '', 'Quick reference'], ref: ['quickref', '', 'Quick reference'],
  pinouts: ['pinouts', '', 'Pinouts'], pinout: ['pinouts', '', 'Pinouts'], chips: ['pinouts', '', 'Pinouts'],
  ports: ['ports', '', 'Ports & connectors'], connectors: ['ports', '', 'Ports & connectors'], connector: ['ports', '', 'Ports & connectors'],
  power: ['power', '', 'Power & test points'], rails: ['power', '', 'Power & test points'], test: ['power', '', 'Power & test points'],
  faults: ['', 'faults', 'Common faults'], symptoms: ['', 'faults', 'Common faults'],

function addAlias(map, word, id) {

function buildIndex() {

  }

  for (const c of Object.values(D.chips)) {
    const m = preferredMachine(c);

    qr.basic.groups.forEach((g, gi) => g.items.forEach(it => idx.push({ g: 'BASIC', t: it, s: `${g.group} — ${qr.basic.dialect}`, h: base + '?sec=basic&g=' + gi, k: `${it} ${g.group} ${m.name}`.toLowerCase() })));

const GROUP_ORDER = ['Go', 'Pins', 'Machines', 'Chips', 'BASIC', 'Keys', 'Memory', 'Terms', 'Connectors', 'Faults'];

function search(raw, limit = 6) {
  const q = raw.trim().toLowerCase();
  if (!q) return [];
  const words = q.split(/\s+/);
  const out = [];
  const seen = new Set();
  const push = r => { if (!seen.has(r.h + r.t)) { seen.add(r.h + r.t); out.push(r); } };

  // mini-syntax: <chip> pin <n> | <chip> <n>
  const chipWord = words.find(w => chipAlias[w]);
  const numM = q.match(/\bpin\s*(\d+)\b/) || (chipWord && q.match(/\b(\d{1,2})\b(?!\s*mhz)/));
  const machWord = words.find(w => machineAlias[w]);
  const secWord = words.find(w => SECTIONS[w]);
  if (chipWord && numM) {
    const n = +numM[1];
    for (const cid of chipAlias[chipWord]) {
      const c = D.chips[cid]; const p = c.pins && c.pins.find(p => p.n === n);
      if (p) push({ g: 'Go', t: `${c.short} pin ${p.n} · ${p.name}`, s: p.desc, h: chipHref(c, machWord ? D.machines[machineAlias[machWord][0]] : null, p.n) });
    }
  }
  if (machWord) {
    for (const mid of machineAlias[machWord]) {
      const m = D.machines[mid];
      if (secWord) {
        const [sec, qs, label] = SECTIONS[secWord];
        push({ g: 'Go', t: `${m.name} › ${label}`, s: m.tagline, h: (sec ? href(m.brand, mid, sec) : machineHref(m)) + (qs ? '?' + qs : '') });
      } else if (chipWord) {
        for (const cid of chipAlias[chipWord]) if (D.chips[cid].machines.includes(mid)) push({ g: 'Go', t: `${D.chips[cid].name} on ${m.name}`, s: D.chips[cid].role, h: chipHref(D.chips[cid], m) });
      } else if (words.length === 1) push({ g: 'Go', t: m.name, s: m.tagline, h: machineHref(m) });
    }
  }
  if (!machWord && secWord && words.length === 1) {
    for (const m of Object.values(D.machines).filter(m => m.status === 'ready')) {
      const [sec, qs, label] = SECTIONS[secWord];
      push({ g: 'Go', t: `${m.name} › ${label}`, s: m.tagline, h: (sec ? href(m.brand, m.id, sec) : machineHref(m)) + (qs ? '?' + qs : '') });
    }
  }

  // generic substring / all-words match
  const pinOnly = q.startsWith('/');
  const scored = [];
  for (const r of idx) {
    if (pinOnly && r.g !== 'Pins' && r.g !== 'Terms') continue;
    const tl = r.t.toLowerCase();
    let sc = 0;

    else if (tl === q) sc = 5; else if (tl.startsWith(q)) sc = 4; else if (tl.includes(q)) sc = 3;

    if (sc) scored.push([sc, r]);

  for (const [, r] of scored) {
    perGroup[r.g] = (perGroup[r.g] || 0) + 1;

  }

}

}
function resultsHTML(list, q, flat) {

/* ---------- command line ---------- */
const cmd = $('#cmd'), resBox = $('#results');

  resBox.innerHTML = resultsHTML(search(q), q, flat) + `<div class="rfoot"><span>↑↓ move · enter open · esc close</span><a href="#/search?q=${encodeURIComponent(q)}">all results</a></div>`;

  $$('.ri', resBox).forEach((el, i) => el.classList.toggle('on', i === state.sel));

/* ---------- drawer ---------- */

document.addEventListener('keydown', e => {
  const inInput = e.target.matches('input, textarea, select');
  if (((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !inInput)) { e.preventDefault(); cmd.focus(); cmd.select(); return; }
  if (e.key === 'Escape') {
    if (!pop.hidden) hidePop();

    else if (drawer.classList.contains('open')) closeDrawer();
    return;
  }
  if (inInput || e.ctrlKey || e.metaKey || e.altKey) return;
  const { parts } = parseHash();
  const k = e.key.toLowerCase();
  if (!parts.length && /^[1-7]$/.test(k)) { const b = D.brands[+k - 1]; if (b) location.hash = href(b.id); }
  else if (parts.length === 1 && /^[1-9]$/.test(k)) { const b = D.brands.find(b => b.id === parts[0]); const mid = b && b.machines[+k - 1]; if (mid) location.hash = href(b.id, mid); }
  else if (parts.length === 2 && 'pqcvf'.includes(k)) {
    const m = D.machines[parts[1]]; if (!m) return;
    const map = { p: 'pinouts', q: 'quickref', c: 'ports', v: 'power' };
    if (k === 'f') { const el = $('#faults'); if (el) el.scrollIntoView({ block: 'start' }); }
    else location.hash = href(m.brand, m.id, map[k]);
  }
});

/* ---------- query helpers ---------- */
function setQuery(key, val) {
  const { parts, q } = parseHash();
  if (val == null) q.delete(key); else q.set(key, val);
  const qs = q.toString();
  history.replaceState(null, '', '#/' + parts.map(encodeURIComponent).join('/') + (qs ? '?' + qs : ''));
}

function sortedPins(chip) {
  const pins = chip.pins.slice();
  if (state.sort === 'name') pins.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }) || a.n - b.n);
  return pins;
}
function glyphSVG(chip) {
  const N = chip.pins.length, half = Math.ceil(N / 2), pitch = 30, top = 36, bx = 104, bw = 112, W = 320;
  const bodyH = half * pitch + 12, H = top + bodyH + 12;
  const byN = Object.fromEntries(chip.pins.map(p => [p.n, p]));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(chip.short)} ${esc(chip.pkg)} seen from ${state.flip ? 'below' : 'above'}, notch up">`;
  s += `<rect class="body" x="${bx}" y="${top}" width="${bw}" height="${bodyH}" rx="3"/>`;
  s += `<path class="notch" d="M ${bx + bw / 2 - 12} ${top} A 12 12 0 0 0 ${bx + bw / 2 + 12} ${top}"/>`;
  for (let i = 0; i < half; i++) {
    const y = top + 6 + i * pitch + pitch / 2;
    const L = state.flip ? N - i : i + 1, R = state.flip ? i + 1 : N - i;
    for (const [n, side] of [[L, 'l'], [R, 'r']]) {
      const p = byN[n]; if (!p) continue;
      const col = PIN_COLORS[p.type] || PIN_COLORS.nc;
      if (side === 'l') {
        s += `<line class="pin" x1="${bx - 26}" x2="${bx}" y1="${y}" y2="${y}" stroke="${col}"/>`;
        if (n === 1) s += `<rect class="one" x="${bx - 30}" y="${y - 5}" width="10" height="10"/>`;
        s += `<text class="n" x="${bx - 34}" y="${y + 3}" text-anchor="end">${n}</text><text x="${bx + 6}" y="${y + 4}">${esc(p.name)}</text>`;
        s += `<rect class="hit" data-pin="${n}" x="0" y="${y - pitch / 2}" width="${W / 2}" height="${pitch}"><title>pin ${n} ${esc(p.name)}</title></rect>`;
      } else {
        s += `<line class="pin" x1="${bx + bw}" x2="${bx + bw + 26}" y1="${y}" y2="${y}" stroke="${col}"/>`;
        if (n === 1) s += `<rect class="one" x="${bx + bw + 20}" y="${y - 5}" width="10" height="10"/>`;
        s += `<text class="n" x="${bx + bw + 34}" y="${y + 3}">${n}</text><text x="${bx + bw - 6}" y="${y + 4}" text-anchor="end">${esc(p.name)}</text>`;
        s += `<rect class="hit" data-pin="${n}" x="${W / 2}" y="${y - pitch / 2}" width="${W / 2}" height="${pitch}"><title>pin ${n} ${esc(p.name)}</title></rect>`;
      }
    }
  }
  return s + '</svg>';
}
function pinTableHTML(chip) {

/* ---------- router ---------- */
function render() {
  const { parts, q } = parseHash();
  hideResults(); hidePop();
  const keepDrawer = parts[2] === 'chip' && q.has('pin');
  if (!keepDrawer) closeDrawer();
  let html, crumbs = [], route = { parts };
  document.body.dataset.route = parts[0] || 'home';
  if (parts[0] !== 'search' && document.activeElement !== cmd) cmd.value = '';
  if (!parts.length) { html = rHome(); }
  else if (parts[0] === 'search') { const s = q.get('q') || ''; html = rSearch(s); crumbs = [['search', '']]; cmd.value = s; }
  else if (parts[0] === 'glossary') { html = rGlossary(); crumbs = [['glossary', '']]; }
  else if (parts[0] === 'resources') { html = rResources(); crumbs = [['resources', '']]; }
  else {
    const b = D.brands.find(b => b.id === parts[0]);
    const m = parts[1] ? D.machines[parts[1]] : null;
    if (!b || (parts[1] && (!m || m.brand !== b.id))) { html = rNotFound(parts); }
    else if (!m) { html = rBrand(b); crumbs = [[b.id, href(b.id)]]; }
    else {
      route.m = m;
      crumbs = [[b.id, href(b.id)], [m.id, machineHref(m)]];
      const sec = parts[2];
      if (!sec) { html = rMachine(m); touchRecent(m); }
      else if (sec === 'pinouts') { html = rPinouts(m); crumbs.push(['pinouts', href(b.id, m.id, 'pinouts')]); }
      else if (sec === 'chip') {
        const chip = D.chips[parts[3]];
        if (!chip) html = rNotFound(parts);
        else { route.chip = chip; state.pin = q.has('pin') ? +q.get('pin') : null; html = rChip(m, chip); crumbs.push(['pinouts', href(b.id, m.id, 'pinouts')], [chip.short.toLowerCase(), '']); }
      }
      else if (sec === 'quickref') { html = rQuickref(m, q); crumbs.push(['quickref', '']); }
      else if (sec === 'ports') { html = rPorts(m, q); crumbs.push(['ports', '']); }
      else if (sec === 'power') { html = rPower(m); crumbs.push(['power', '']); }
      else html = rNotFound(parts);
    }
  }
  state.route = route;
  $('#crumbs').innerHTML = crumbsHTML(crumbs);
  $('#main').innerHTML = html;
  // post-render
  if (route.chip && q.has('pin')) {
    const n = +q.get('pin');
    if (route.chip.pins && route.chip.pins.some(p => p.n === n)) { state.pin = n; $$('#main [data-pin]').forEach(el => el.classList.toggle('sel', +el.dataset.pin === n)); openDrawer({ kind: 'pin', chip: route.chip, m: route.m, n }, true); }
  } else if (parts[0] === 'glossary' && q.get('term')) { openDrawer({ kind: 'term', id: q.get('term') }, true); setQuery('term', null); }
  const scrollTo = parts[2] === 'quickref' && q.get('sec') ? '#sec-' + q.get('sec') : parts[2] === 'ports' && q.get('c') ? '#c-' + q.get('c') : (parts.length === 2 && q.get('sec') === 'faults') ? '#faults' : null;
  if (scrollTo && $(scrollTo)) { const el = $(scrollTo); requestAnimationFrame(() => window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 60)); }
  else window.scrollTo(0, 0);
  document.title = `Retro Bench${crumbs.length ? ' · ' + crumbs.map(c => c[0]).join('/') : ''}`;
}
function touchRecent(m) {
  state.recent = [m.id, ...state.recent.filter(id => id !== m.id)].slice(0, 6);
  LS.set('recent', state.recent);
}
// in-page anchors (faults) without re-render
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-local]');
  if (a) { e.preventDefault(); const el = $('#' + a.dataset.local); if (el) el.scrollIntoView({ block: 'start' }); }
});

/* ---------- narrow-mode flag (drawer becomes full screen) ---------- */
const mq = matchMedia('(max-width:480px), (max-width:1023px) and (orientation:portrait)');
const setNarrow = () => document.body.classList.toggle('narrow', mq.matches);
mq.addEventListener('change', setNarrow); setNarrow();

/* ---------- boot ---------- */
buildIndex();
applyTheme();
window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
</html>
